name: デスクトップアプリ自動ビルド・リリース

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "DEPLOY_FREEZE 中でも強制的にリリースする"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# DEPLOY_FREEZE = true (リポジトリ変数) の間は、main への push でリリースを差し替えない。
jobs:
  build-windows:
    if: vars.DEPLOY_FREEZE != 'true' || inputs.force_release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable Windows exe
        run: npm run desktop:build:win-portable

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist-desktop
          cp src-tauri/target/release/stagesounds.exe dist-desktop/StageSounds-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist-desktop/StageSounds-Windows.exe

  build-macos:
    if: vars.DEPLOY_FREEZE != 'true' || inputs.force_release
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS .app
        run: npm run desktop:build:mac-app

      - name: Zip .app bundle
        run: |
          mkdir -p dist-desktop
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/StageSounds.app" \
            "dist-desktop/StageSounds-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist-desktop/StageSounds-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-desktop

      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist-desktop

      # ビルドごとに別タグ(build-<番号>)の固定リリースを作る。
      # 以前は latest を削除→再作成していたため、その間ダウンロードリンクが切れる・
      # 壊れたビルドを出すと前のビルドに戻せない、という問題があった。
      # 過去のビルドはすべて Releases に残るので、問題があれば一つ前のものをダウンロードすればよい。
      - name: リリースを公開
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ビルド ${{ github.run_number }} (${{ github.sha }})
          make_latest: true
          body: |
            ## ダウンロード方法

            - **Windows**: `StageSounds-Windows.exe` をダウンロードして、ダブルクリックで起動してください（インストール不要）。
            - **Mac**: `StageSounds-macOS.zip` をダウンロードして解凍し、中の `StageSounds.app` をダブルクリックで起動してください。
              - 初回起動時に「開発元が未確認のため開けません」と表示された場合は、アプリを右クリック（または Control+クリック）して「開く」を選んでください。

            このリリースは main ブランチが更新されるたびに自動的に作成されます。
            新しいビルドで問題が起きた場合は、Releases 一覧から一つ前のビルドをダウンロードしてください。
          files: |
            dist-desktop/StageSounds-Windows.exe
            dist-desktop/StageSounds-macOS.zip

      # 旧方式の latest タグのリリースが残っていると古いビルドを掴む人が出るため、
      # 新しいリリースの公開に成功した「後」で削除する(ダウンロード不能な時間を作らない)。
      - name: 旧方式の latest リリースを削除（あれば）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true
